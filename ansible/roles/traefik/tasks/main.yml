---
- name: Add Helm repository for Traefik
  kubernetes.core.helm_repository:
    name: traefik
    repo_url: https://traefik.github.io/charts

- name: Deploy Traefik Helm chart
  kubernetes.core.helm:
    name: "{{ traefik_release_name }}"
    update_repo_cache: true
    chart_ref: traefik/traefik
    chart_version: "{{ traefik_chart_version }}"
    release_namespace: "{{ traefik_namespace }}"
    create_namespace: true
    values:
      "{{ traefik_values }}"

- name: Deploy VMServiceScrape for Traefik
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: "{{ traefik_release_name }}"
        namespace: "{{ traefik_namespace }}"
        labels:
          app.kubernetes.io/name: "{{ traefik_release_name }}"
      spec:
        endpoints:
          - port: metrics
            path: /metrics
        selector:
          matchLabels:
            app.kubernetes.io/name: "{{ traefik_release_name }}"
            app.kubernetes.io/instance: "{{ traefik_release_name }}-{{ traefik_namespace }}"
            app.kubernetes.io/component: metrics
